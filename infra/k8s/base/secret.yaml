# =============================================================================
# TEMPLATE ONLY. Every value below is a placeholder — this file documents the
# required shape of the Secret so `kubectl apply -k` produces a working
# object in a scratch/dev cluster, but it must NEVER be the source of real
# secrets in any environment a customer's money touches.
#
# In staging/production, this file is not applied directly. Instead:
#   - External Secrets Operator syncs from AWS Secrets Manager / GCP Secret
#     Manager / Vault into a Secret with this same name and these same keys, or
#   - Sealed Secrets encrypts the real values asymmetrically so the ciphertext
#     itself is safe to commit (see infra/k8s/overlays/production's README).
#
# The private key is the highest-value secret in this whole system — see
# docs/01-santimpay-protocol-spec.md §1.1: SantimPay holds a copy too, so this
# key authenticates BOTH outbound requests and inbound webhook verification.
#
# No admin credential lives here. /admin is gated by real session-based
# login against the User table (role STAFF/ADMIN), not a shared password —
# see infra/k8s/README.md's "Bootstrapping the first admin user" section for
# how to create that first account after a fresh deploy.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: santim-web-secrets
  namespace: santim-commerce
type: Opaque
stringData:
  DATABASE_URL: "postgresql://CHANGE_ME:CHANGE_ME@postgres-host:5432/santim_commerce?schema=public&sslmode=require"
  APP_URL: "https://shop.example.et"
  SANTIMPAY_MERCHANT_ID: "CHANGE_ME"
  # Base64-encoded PEM — see apps/web/src/server/config/env.ts's SANTIMPAY_PRIVATE_KEY_B64 handling.
  SANTIMPAY_PRIVATE_KEY_B64: "CHANGE_ME"
  SANTIMPAY_GATEWAY_TOKEN: "CHANGE_ME"
  SESSION_SECRET: "CHANGE_ME_generate_with_openssl_rand_base64_48"
  METRICS_TOKEN: "CHANGE_ME_generate_with_openssl_rand_hex_32"
