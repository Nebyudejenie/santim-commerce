# =============================================================================
# The web tier: storefront, admin, API routes, webhook receiver.
#
# Every field here answers a specific "what happens when this fails?"
# question — the comments say which one.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: santim-web
  namespace: santim-commerce
  labels:
    app.kubernetes.io/name: santim-web
    app.kubernetes.io/part-of: santim-commerce
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never fewer than current capacity during a deploy — a payment page
      # returning 503 because we scaled down before scaling up is a
      # self-inflicted outage during routine maintenance.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: santim-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: santim-web
        app.kubernetes.io/part-of: santim-commerce
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /api/metrics
        prometheus.io/port: "3000"
    spec:
      serviceAccountName: santim-web
      # Spread replicas across nodes/zones — three replicas on one node is
      # one node failure away from being one replica.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: santim-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/example-org/santim-commerce:latest # overridden per-environment; see overlays
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: santim-web-config
            - secretRef:
                name: santim-web-secrets
          # Defence in depth even inside the container: read-only root FS,
          # no capabilities, no privilege escalation. None of this app's
          # code needs to write outside /tmp.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/apps/web/.next/cache
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              # No CPU limit: CPU-throttling a request-serving process under
              # its own limit causes exactly the p99 latency spikes an SLO
              # dashboard will page someone about. Memory DOES get a limit —
              # a leak should crash-and-restart the one pod, not starve the node.
              memory: 512Mi
          # LIVENESS: "is this process wedged?" Never touches the database —
          # see api/health/route.ts's module comment for why a dependency
          # check here would turn a brief Postgres blip into a fleet-wide
          # restart storm.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # READINESS: "should this pod receive traffic right now?" DOES
          # check the database — a pod that can't reach Postgres should be
          # pulled from the Service, not killed (it may recover in seconds).
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # STARTUP: Next.js's first request after a cold start compiles
          # more than a warm one. Without this, a slow first request can trip
          # the liveness probe's shorter timeout during pod startup specifically.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 12 # up to 60s to become healthy before liveness takes over
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
      # Long enough for an in-flight checkout's server action / webhook
      # handler to finish before SIGKILL — see worker/index.ts's graceful
      # shutdown comment for the same reasoning applied to the worker.
      terminationGracePeriodSeconds: 30
