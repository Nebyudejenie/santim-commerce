# A dedicated ServiceAccount per app, not `default`. `default` is implicitly
# usable by anything deployed into the namespace without a specific SA — a
# NetworkPolicy or RBAC rule scoped to "the web app" cannot target that,
# because it doesn't uniquely identify the web app.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: santim-web
  namespace: santim-commerce
automountServiceAccountToken: false # this app talks to Postgres and SantimPay, never to the k8s API
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: santim-worker
  namespace: santim-commerce
automountServiceAccountToken: false
