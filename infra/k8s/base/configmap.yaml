# Non-secret configuration only. The private key, gateway token, session
# secret, and database credentials live in secret.yaml (in real use, in a
# Secret populated by External Secrets Operator / Sealed Secrets — never a
# plain committed manifest with real values). Everything here is safe to
# read in `kubectl describe configmap` by anyone with namespace access.
apiVersion: v1
kind: ConfigMap
metadata:
  name: santim-web-config
  namespace: santim-commerce
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  SANTIMPAY_ENVIRONMENT: "production"
  SANTIMPAY_TIMEOUT_MS: "15000"
  WEBHOOK_MAX_AGE_SECONDS: "300"
  RESERVATION_TTL_MINUTES: "20"
  WORKER_METRICS_PORT: "9091"
