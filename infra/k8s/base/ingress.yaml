# =============================================================================
# TLS terminates here. SantimPay will not deliver webhooks to a plaintext
# notifyUrl — see env.ts's boot-time check requiring APP_URL to be HTTPS in
# production — and this Ingress is what makes the HTTPS half of that promise
# real at the network edge.
#
# The webhook path gets its own annotation-free treatment deliberately: no
# aggressive WAF rule or bot-challenge should ever intercept a SantimPay
# callback before it reaches the app, where signature verification is the
# actual, cryptographic authority on whether to trust it (see
# webhook.ts — a WAF blocking a legitimate signed callback looks identical to
# a stuck payment from the customer's side).
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: santim-web
  namespace: santim-commerce
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Webhook deliveries and the checkout hosted-page redirect are not
    # multi-megabyte, but keep this explicit rather than trusting a default.
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - shop.example.et
      secretName: santim-web-tls
  rules:
    - host: shop.example.et
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: santim-web
                port:
                  name: http
