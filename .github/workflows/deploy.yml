# =============================================================================
# Deploy — triggered by a version tag, never by a bare push to main.
#
# WHY A TAG AND NOT "every merge to main"
# Continuous deployment sounds good until a payment system does it: an
# untagged auto-deploy means "someone merged" and "money-moving code went to
# production" are the same event, with no human checkpoint and no clean
# rollback target. Tagging is the checkpoint — `git push --tags` after
# deciding a commit is actually ready, and the tag itself becomes the
# rollback target (`git checkout v1.4.2`, redeploy that image digest).
#
# This workflow builds the SAME Dockerfile CI already validated, pushes it by
# DIGEST (never a mutable tag like `latest` — see the image reference below),
# and applies it with `kubectl set image` plus a scripted rollout wait, so a
# bad deploy is caught here, in CI, rather than by a customer mid-checkout.
# =============================================================================

name: Deploy

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write  # OIDC federation to the registry/cluster — no long-lived cloud keys stored as secrets

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build, sign, and push
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # github.repository preserves this repo's actual owner casing
      # (Nebyudejenie/santim-commerce — capital N), but GHCR, like every
      # Docker registry, requires an all-lowercase path — confirmed for
      # real: `docker tag alpine ghcr.io/Nebyudejenie/santim-commerce:x`
      # fails outright with "invalid reference format: repository name
      # ... must be lowercase". GitHub Actions expressions have no
      # toLower() built in, so this has to be a shell step. Computed once
      # here and threaded through as a job output — env vars set in one
      # job don't carry over to the separate `deploy` job below.
      - name: Compute lowercase image reference
        id: image
        run: echo "name=${REPO,,}" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ env.REGISTRY }}/${{ github.repository }}

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          cache-from: type=gha

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signing via OIDC (Sigstore/Fulcio) — the signature is tied to
      # this workflow's identity, not a private key sitting in repo secrets
      # that would need rotating and could leak.
      - name: Sign the image (keyless)
        run: cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"

  deploy:
    name: Roll out to production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production  # requires manual approval if configured as a protected GitHub environment
    steps:
      - uses: actions/checkout@v7

      - name: Configure cluster access
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      # A Job's pod template — including its image — is immutable once
      # created, unlike a Deployment's, so a plain re-apply can't update a
      # previous run's Job the way `kubectl set image` updates the
      # Deployments below. Delete any prior run first (job-migrate.yaml's
      # own comment explains why a fixed name plus delete-before-apply was
      # chosen over a per-release suffix), and pipe the rendered manifests
      # through this run's actual digest before they're ever applied — the
      # committed `ghcr.io/example-org/santim-commerce:latest` placeholder
      # is only ever a fallback for a bare `kubectl apply -k`, never what
      # should actually run migrations.
      - name: Apply manifests
        run: |
          kubectl delete job/santim-db-migrate -n santim-commerce --ignore-not-found
          kubectl kustomize infra/k8s/overlays/production \
            | sed "s|ghcr.io/example-org/santim-commerce:latest|${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}|g" \
            | kubectl apply -f -

      # infra/k8s/README.md documents this wait as part of the deploy
      # sequence — this step is what actually makes that true. Without it,
      # nothing stopped the Deployments below from rolling out new code
      # before migrations had finished applying against the database it
      # expects.
      - name: Wait for migrations
        run: kubectl wait --for=condition=complete job/santim-db-migrate -n santim-commerce --timeout=300s

      # The Deployments already carry the correct digest from the apply
      # above (the same sed rewrite touched them too) — this is now a
      # no-op confirmation more than a real change, and kept anyway: it's
      # the one step here that can't silently do nothing if a future change
      # ever decouples the Job and Deployment image sources again.
      #
      # Deploy BY DIGEST, not by the tag — a mutable tag can be repointed
      # (accidentally or by a compromised registry) after this step runs; a
      # digest is the content itself and cannot silently change underneath us.
      - name: Pin the deployed image to this build's digest
        run: |
          kubectl set image deployment/santim-web \
            web="${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}" \
            -n santim-commerce
          kubectl set image deployment/santim-worker \
            worker="${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}" \
            -n santim-commerce

      # Blocks the job on the rollout actually succeeding — readiness probes
      # failing here means kubectl exits non-zero and this job fails LOUDLY,
      # before a human finds out from a customer instead of from CI.
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/santim-web -n santim-commerce --timeout=180s
          kubectl rollout status deployment/santim-worker -n santim-commerce --timeout=180s

      - name: Roll back on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/santim-web -n santim-commerce
          kubectl rollout undo deployment/santim-worker -n santim-commerce
