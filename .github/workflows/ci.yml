# =============================================================================
# CI pipeline.
#
# Stage order is deliberate and front-loaded with the cheapest checks:
#
#   typecheck/lint (seconds)  →  unit tests (seconds)  →
#   integration tests against real Postgres (~1 min)  →
#   build + scan the actual container image (~2 min)
#
# A broken import fails in 20 seconds here, not after a 3-minute Docker build.
# Reordering these stages the other way round is the single most common way
# a CI pipeline becomes something people stop waiting for.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same PR cancels the still-running check for the first —
# no point burning minutes validating a diff nobody will merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # pnpm's version is NOT set here — it's pinned once, in package.json's
  # "packageManager" field, and pnpm/action-setup@v4 reads that
  # automatically. Passing an explicit `version:` input here TOO produced
  # a real, caught-in-production failure: "Multiple versions of pnpm
  # specified" (the action refuses to guess which one wins), the moment
  # this repo's first real CI run happened. One source of truth, not two.

jobs:
  # ---------------------------------------------------------------- quality
  quality:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @prisma/client's postinstall hook normally runs `prisma generate`
      # automatically — but pnpm blocks dependency lifecycle scripts by
      # default (a supply-chain-attack mitigation), so on a genuinely clean
      # checkout it silently doesn't run. This is why `Module "@prisma/client"
      # has no exported member 'PrismaClient'` showed up on this repo's very
      # first real CI run despite typechecking clean on every local machine
      # this was developed on — a local machine that had EVER run
      # `prisma migrate dev` keeps a generated client around indefinitely,
      # which hid the gap until a truly fresh environment (this one) hit it.
      - name: Generate Prisma Client
        run: pnpm --filter @santim/web db:generate

      # The SDK is a workspace dependency; the web app's typecheck needs its
      # compiled `dist/` (see packages/santimpay's own module-resolution
      # comment in package.json) — build it before anything that imports it.
      - name: Build @santim/santimpay
        run: pnpm --filter @santim/santimpay build

      - name: Typecheck all packages
        run: pnpm -r typecheck

      - name: "Unit tests: @santim/santimpay (signing, webhook verification, retries, error taxonomy)"
        run: pnpm --filter @santim/santimpay test

      - name: "Unit tests: web (state machine, no database required)"
        run: pnpm --filter @santim/web test:unit

  # ------------------------------------------------------------ integration
  integration:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: santim
          POSTGRES_PASSWORD: santim
          POSTGRES_DB: santim_commerce
        ports:
          - 5432:5432
        # Wait for the DB to actually accept connections, not just for the
        # container to start — those are not the same moment.
        options: >-
          --health-cmd "pg_isready -U santim -d santim_commerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://santim:santim@localhost:5432/santim_commerce?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # See the quality job's identical step for why this can't be skipped —
      # `prisma migrate deploy` below applies the schema to Postgres, but
      # does not reliably regenerate the TypeScript client on its own.
      - name: Generate Prisma Client
        run: pnpm --filter @santim/web db:generate

      - name: Build @santim/santimpay
        run: pnpm --filter @santim/santimpay build

      - name: Apply migrations
        run: pnpm --filter @santim/web exec prisma migrate deploy

      # This is the test that actually proves the oversell-prevention claim:
      # 200 concurrent buyers against 1 unit of real Postgres-backed stock.
      # A mocked Prisma client cannot exercise the row-locking behaviour the
      # code depends on — see reservation.integration.test.ts's module doc.
      - name: Integration tests (concurrency-safe inventory reservation)
        run: pnpm --filter @santim/web test:integration

  # ------------------------------------------------------------------ build
  build:
    name: Build & scan container image
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Layer cache keyed on the GitHub Actions cache backend. Without this,
      # every PR rebuilds node_modules from scratch — see the Dockerfile's own
      # comment on why layer order/caching matters at all.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: false
          load: true
          tags: santim-commerce:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: santim-commerce:${{ github.sha }}
          format: table
          # CI fails on HIGH/CRITICAL, not on every finding — a pipeline that
          # blocks merges over a LOW-severity issue in a transitive dev
          # dependency trains people to bypass it, which defeats the point.
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          # See .trivyignore's own comment: every entry there is a specific,
          # dated, reasoned exception (npm's own bundled tooling, never
          # reachable from the running app) — not a blanket suppression.
          trivyignores: .trivyignore

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: santim-commerce:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  # --------------------------------------------------------------- required
  # A single job every branch-protection rule can point at, regardless of how
  # the matrix above evolves — adding a job later means adding it to `needs`
  # here once, not re-editing every repo's required-checks setting.
  ci-required:
    name: CI required checks
    runs-on: ubuntu-latest
    needs: [quality, integration, build]
    if: always()
    steps:
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
